<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Global export market routes from China</title>
  <desc id="desc">Blue world map with export routes from China and labeled destination countries.</desc>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9fcff"/>
      <stop offset="1" stop-color="#e9f5ff"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfe1fb"/>
      <stop offset="1" stop-color="#68aee8"/>
    </linearGradient>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6aa7d8" flood-opacity=".34"/>
    </filter>
    <style>
      .grid{fill:none;stroke:#d7e8f5;stroke-width:1.1}
      .land{fill:url(#land);stroke:#ffffff;stroke-width:2.2;stroke-linejoin:round;filter:url(#softShadow)}
      .country-line{fill:none;stroke:#75a9cf;stroke-width:1;opacity:.52}
      .route{fill:none;stroke:#c9896d;stroke-width:1.1;opacity:.72}
      .marker{fill:#fff;stroke:#c62828;stroke-width:2}
      .china{fill:#0b3c74;stroke:#fff;stroke-width:2}
      .label{font:700 13px Arial,Helvetica,sans-serif;fill:#15385c;paint-order:stroke;stroke:#fff;stroke-width:4;stroke-linejoin:round}
      .china-label{font:700 13px Arial,Helvetica,sans-serif;fill:#fff}
    </style>
  </defs>
  <rect width="1000" height="520" rx="16" fill="url(#sea)"/>
